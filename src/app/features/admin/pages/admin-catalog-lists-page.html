<h1>Categorías y tallas</h1>
<p class="intro">
  Se agregan, editan y desactivan; nunca se borran. Desactivar no cambia las prendas que ya las
  usan.
</p>
<cp-loading-bar [active]="store.isLoading() || saving.isSaving()" />
@if (saving.errorMessage(); as message) {
  <p class="error" role="alert">{{ message }}</p>
}

@if (store.hasError()) {
  <cp-empty-state icon="info" message="No pudimos cargar las listas.">
    <button mat-button type="button" (click)="store.reload()">Reintentar</button>
  </cp-empty-state>
} @else {
  <mat-tab-group mat-stretch-tabs="false">
    <mat-tab [label]="names.categories.plural">
      <div class="tab">
        <button mat-stroked-button type="button" (click)="editLookup('categories', null)">
          <mat-icon>add</mat-icon>
          Agregar categoría
        </button>
        <cp-catalog-list
          [rows]="categoryRows()"
          (edit)="editLookup('categories', $event)"
          (toggleActive)="toggleLookup('categories', $event)"
        />
      </div>
    </mat-tab>
    <mat-tab [label]="names.pet_types.plural">
      <div class="tab">
        <button mat-stroked-button type="button" (click)="editLookup('pet_types', null)">
          <mat-icon>add</mat-icon>
          Agregar tipo de mascota
        </button>
        <cp-catalog-list
          [rows]="petTypeRows()"
          (edit)="editLookup('pet_types', $event)"
          (toggleActive)="toggleLookup('pet_types', $event)"
        />
      </div>
    </mat-tab>
    <mat-tab label="Tallas">
      <div class="tab">
        <p class="hint">
          Los rangos de cada talla se ven en la guía de tallas y los usa la calculadora.
        </p>
        <button mat-stroked-button type="button" (click)="editSize(null)">
          <mat-icon>add</mat-icon>
          Agregar talla
        </button>
        <cp-catalog-list
          [rows]="sizeRows()"
          (edit)="editSize($event)"
          (toggleActive)="toggleSize($event)"
        />
      </div>
    </mat-tab>
  </mat-tab-group>
}
